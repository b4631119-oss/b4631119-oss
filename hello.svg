<svg
  width="1200"
  height="360"
  viewBox="0 0 1200 360"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
>
  <defs>
    <!-- Background -->
    <linearGradient
      id="bg"
      x1="0"
      y1="0"
      x2="1200"
      y2="360"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.5" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <!-- Main blue/cyan line -->
    <linearGradient
      id="lineMain"
      x1="100"
      y1="250"
      x2="1100"
      y2="90"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.45" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Secondary line -->
    <linearGradient
      id="lineSecondary"
      x1="1100"
      y1="100"
      x2="150"
      y2="280"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#818CF8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Name gradient (fixed to userSpaceOnUse so the coordinates below apply correctly) -->
    <linearGradient
      id="nameGradient"
      gradientUnits="userSpaceOnUse"
      x1="80"
      y1="80"
      x2="600"
      y2="150"
    >
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="0.55" stop-color="#E0E7FF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>

    <!-- Shimmer band that sweeps across the name -->
    <linearGradient
      id="shimmerGrad"
      gradientUnits="userSpaceOnUse"
      x1="0"
      y1="70"
      x2="70"
      y2="160"
    >
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        calcMode="spline"
        keyTimes="0;0.55;1"
        keySplines="0.33 0 0.2 1;0.33 0 0.2 1"
        values="0 0;900 0;900 0"
        dur="6s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <!-- Mask limiting the shimmer to the glyph shapes of the name -->
    <mask id="nameMask">
      <rect x="0" y="0" width="1200" height="360" fill="#000000"/>
      <text
        x="78"
        y="105"
        fill="#FFFFFF"
        font-family="Inter, Arial, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1"
      >
        Madaminzhon
      </text>
      <text
        x="78"
        y="151"
        fill="#FFFFFF"
        font-family="Inter, Arial, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1"
      >
        Madazimov
      </text>
    </mask>

    <!-- Soft violet glow -->
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6366F1" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft cyan glow -->
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Main line glow -->
    <filter
      id="lineGlow"
      x="-30%"
      y="-100%"
      width="160%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="7"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Point glow -->
    <filter
      id="pointGlow"
      x="-300%"
      y="-300%"
      width="700%"
      height="700%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Invisible reference paths the comets travel along -->
    <path
      id="motionPath1"
      d="M90 250 C210 170 300 120 430 145 C565 170 650 260 810 235 C940 215 1010 125 1100 85"
      fill="none"
    />
    <path
      id="motionPath2"
      d="M110 110 C270 165 390 230 525 220 C670 210 760 115 900 115 C990 115 1045 145 1090 175"
      fill="none"
    />

    <!-- Clip -->
    <clipPath id="roundedClip">
      <rect
        x="0"
        y="0"
        width="1200"
        height="360"
        rx="28"
      />
    </clipPath>
  </defs>

  <!-- ========================= -->
  <!-- BACKGROUND -->
  <!-- ========================= -->

  <rect
    width="1200"
    height="360"
    rx="28"
    fill="url(#bg)"
  />

  <g clip-path="url(#roundedClip)">

    <!-- Decorative glows, drifting slowly for ambience -->

    <circle
      cx="1000"
      cy="70"
      r="190"
      fill="url(#violetGlow)"
    >
      <animate attributeName="cx" values="1000;1035;1000" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;95;70" dur="16s" repeatCount="indefinite"/>
    </circle>

    <circle
      cx="1080"
      cy="210"
      r="170"
      fill="url(#cyanGlow)"
    >
      <animate attributeName="cx" values="1080;1045;1080" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="r" values="170;185;170" dur="13s" repeatCount="indefinite"/>
    </circle>

    <circle
      cx="930"
      cy="80"
      r="115"
      fill="#6366F1"
      fill-opacity="0.045"
    />

    <circle
      cx="1040"
      cy="120"
      r="95"
      fill="#38BDF8"
      fill-opacity="0.035"
    />

    <!-- Ambient particles -->

    <g fill="#A5B4FC">
      <circle cx="870" cy="60" r="1.6" opacity="0">
        <animate attributeName="opacity" values="0;0.8;0" dur="4.5s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;40;60" dur="4.5s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1055" cy="180" r="1.4" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="5.2s" begin="-1.5s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="180;158;180" dur="5.2s" begin="-1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="230" r="1.8" opacity="0">
        <animate attributeName="opacity" values="0;0.75;0" dur="6s" begin="-3s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="230;204;230" dur="6s" begin="-3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1120" cy="90" r="1.4" opacity="0">
        <animate attributeName="opacity" values="0;0.7;0" dur="4.8s" begin="-2.2s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;68;90" dur="4.8s" begin="-2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ========================= -->
    <!-- GRID -->
    <!-- ========================= -->

    <g
      stroke="#94A3B8"
      stroke-opacity="0.13"
      stroke-width="1"
    >
      <animate attributeName="stroke-opacity" values="0.13;0.18;0.13" dur="7s" repeatCount="indefinite"/>

      <!-- Horizontal -->
      <path d="M45 80H1155"/>
      <path d="M45 150H1155"/>
      <path d="M45 220H1155"/>
      <path d="M45 290H1155"/>

      <!-- Vertical -->
      <path d="M120 35V325"/>
      <path d="M320 35V325"/>
      <path d="M520 35V325"/>
      <path d="M720 35V325"/>
      <path d="M920 35V325"/>
      <path d="M1120 35V325"/>
    </g>

    <!-- ========================= -->
    <!-- MAIN WAVE -->
    <!-- ========================= -->

    <g filter="url(#lineGlow)">

      <path
        d="
          M90 250
          C210 170 300 120 430 145
          C565 170 650 260 810 235
          C940 215 1010 125 1100 85
        "
        stroke="url(#lineMain)"
        stroke-width="3.8"
        stroke-linecap="round"
        fill="none"
      >
        <animate
          attributeName="d"
          dur="11s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
          values="
            M90 250 C210 170 300 120 430 145 C565 170 650 260 810 235 C940 215 1010 125 1100 85;
            M90 240 C215 155 305 108 438 130 C572 152 655 270 818 240 C948 212 1018 138 1100 96;
            M90 254 C205 182 295 132 425 158 C560 184 645 250 805 230 C935 210 1005 118 1100 80;
            M90 236 C218 148 310 100 442 126 C578 150 660 278 822 244 C952 214 1022 142 1100 100;
            M90 250 C210 170 300 120 430 145 C565 170 650 260 810 235 C940 215 1010 125 1100 85
          "
        />
      </path>

      <!-- Secondary wave -->

      <path
        d="
          M110 110
          C270 165 390 230 525 220
          C670 210 760 115 900 115
          C990 115 1045 145 1090 175
        "
        stroke="url(#lineSecondary)"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
      >
        <animate
          attributeName="d"
          dur="9s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1;0.45 0 0.55 1"
          values="
            M110 110 C270 165 390 230 525 220 C670 210 760 115 900 115 C990 115 1045 145 1090 175;
            M110 100 C273 152 393 240 528 228 C676 216 763 122 903 126 C993 130 1044 155 1090 184;
            M110 118 C266 174 386 220 521 214 C664 206 756 110 897 108 C987 108 1046 138 1090 168;
            M110 94 C276 148 396 246 531 232 C680 220 766 128 906 132 C996 136 1043 160 1090 190;
            M110 110 C270 165 390 230 525 220 C670 210 760 115 900 115 C990 115 1045 145 1090 175
          "
        />
      </path>

    </g>

    <!-- ========================= -->
    <!-- TRAVELING COMETS -->
    <!-- ========================= -->

    <g filter="url(#pointGlow)">

      <!-- Comet trail along the main wave -->
      <circle r="6" fill="url(#lineMain)">
        <animateMotion dur="7s" repeatCount="indefinite" rotate="auto">
          <mpath xlink:href="#motionPath1" href="#motionPath1"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.92;1" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="4" fill="url(#lineMain)" opacity="0.55">
        <animateMotion dur="7s" begin="-0.28s" repeatCount="indefinite" rotate="auto">
          <mpath xlink:href="#motionPath1" href="#motionPath1"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;0.55;0.55;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="-0.28s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.6" fill="url(#lineMain)" opacity="0.3">
        <animateMotion dur="7s" begin="-0.55s" repeatCount="indefinite" rotate="auto">
          <mpath xlink:href="#motionPath1" href="#motionPath1"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;0.3;0.3;0" keyTimes="0;0.06;0.92;1" dur="7s" begin="-0.55s" repeatCount="indefinite"/>
      </circle>

      <!-- Comet gliding the opposite way along the secondary wave -->
      <circle r="4.5" fill="url(#lineSecondary)">
        <animateMotion dur="9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" rotate="auto">
          <mpath xlink:href="#motionPath2" href="#motionPath2"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.06;0.92;1" dur="9s" repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- ========================= -->
    <!-- DATA POINTS -->
    <!-- ========================= -->

    <g filter="url(#pointGlow)">

      <!-- Cyan point -->
      <circle
        cx="430"
        cy="145"
        r="6"
        fill="#38BDF8"
      >
        <animate
          attributeName="cy"
          values="145;137;145"
          dur="3.2s"
          repeatCount="indefinite"
        />

        <animate
          attributeName="r"
          values="6;7;6"
          dur="3.2s"
          repeatCount="indefinite"
        />
      </circle>

      <!-- White point -->
      <circle
        cx="812"
        cy="235"
        r="7"
        fill="#F8FAFC"
      >
        <animate
          attributeName="cy"
          values="235;227;235"
          dur="2.8s"
          repeatCount="indefinite"
        />

        <animate
          attributeName="r"
          values="7;8;7"
          dur="2.8s"
          repeatCount="indefinite"
        />
      </circle>

      <!-- Violet point -->
      <circle
        cx="902"
        cy="115"
        r="6"
        fill="#818CF8"
      >
        <animate
          attributeName="cy"
          values="115;108;115"
          dur="3.6s"
          repeatCount="indefinite"
        />

        <animate
          attributeName="r"
          values="6;7;6"
          dur="3.6s"
          repeatCount="indefinite"
        />
      </circle>

    </g>

    <!-- ========================= -->
    <!-- MAIN TEXT -->
    <!-- ========================= -->

    <g>

      <!-- First name -->

      <text
        x="78"
        y="105"
        fill="url(#nameGradient)"
        font-family="Inter, Arial, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1"
      >
        bilol
      </text>

      <!-- Last name -->

      <text
        x="78"
        y="151"
        fill="url(#nameGradient)"
        font-family="Inter, Arial, sans-serif"
        font-size="43"
        font-weight="700"
        letter-spacing="-1"
      >
        Madazimov
      </text>

      <!-- Shimmer sweep, clipped to the glyph shapes above -->
      <g mask="url(#nameMask)">
        <rect x="0" y="55" width="1200" height="115" fill="url(#shimmerGrad)"/>
      </g>

      <!-- Profession -->

      <text
        x="80"
        y="183"
        fill="#A1A1AA"
        font-family="Inter, Arial, sans-serif"
        font-size="18"
        font-weight="500"
      >
        Full Stack Developer • Building modern web systems
      </text>

    </g>

    <!-- ========================= -->
    <!-- CATEGORY LABELS -->
    <!-- ========================= -->

    <g>

      <!-- Frontend -->

      <text
        x="80"
        y="235"
        fill="#38BDF8"
        font-family="Inter, Arial, sans-serif"
        font-size="17"
        font-weight="650"
      >
        frontend systems
      </text>

      <circle
        cx="80"
        cy="248"
        r="2"
        fill="#38BDF8"
      />

      <rect
        x="80"
        y="250"
        width="82"
        height="1"
        fill="#38BDF8"
        fill-opacity="0.35"
      />

      <!-- Backend -->

      <text
        x="300"
        y="235"
        fill="#E5E7EB"
        font-family="Inter, Arial, sans-serif"
        font-size="17"
        font-weight="650"
      >
        backend systems
      </text>

      <circle
        cx="300"
        cy="248"
        r="2"
        fill="#818CF8"
      />

      <rect
        x="300"
        y="250"
        width="82"
        height="1"
        fill="#818CF8"
        fill-opacity="0.35"
      />

      <!-- Full Stack -->

      <text
        x="520"
        y="235"
        fill="#818CF8"
        font-family="Inter, Arial, sans-serif"
        font-size="17"
        font-weight="650"
      >
        full stack solutions
      </text>

      <circle
        cx="520"
        cy="248"
        r="2"
        fill="#818CF8"
      />

      <rect
        x="520"
        y="250"
        width="100"
        height="1"
        fill="#818CF8"
        fill-opacity="0.35"
      />

    </g>

    <!-- ========================= -->
    <!-- BADGE -->
    <!-- ========================= -->

    <rect
      x="78"
      y="272"
      width="295"
      height="40"
      rx="20"
      fill="#0F172A"
      fill-opacity="0.88"
      stroke="#334155"
      stroke-opacity="0.7"
    />

    <!-- Badge glow -->

    <circle
      cx="106"
      cy="292"
      r="6"
      fill="#38BDF8"
      filter="url(#pointGlow)"
    >
      <animate
        attributeName="r"
        values="6;8;6"
        dur="2s"
        repeatCount="indefinite"
      />
      <animate
        attributeName="fill"
        values="#38BDF8;#818CF8;#38BDF8"
        dur="4s"
        repeatCount="indefinite"
      />
    </circle>

    <text
      x="123"
      y="298"
      fill="#E5E7EB"
      font-family="Inter, Arial, sans-serif"
      font-size="14"
      font-weight="600"
    >
      Building modern digital experiences
    </text>

  </g>

  <!-- ========================= -->
  <!-- BORDER -->
  <!-- ========================= -->

  <rect
    x="0.75"
    y="0.75"
    width="1198.5"
    height="358.5"
    rx="27.25"
    stroke="#334155"
    stroke-opacity="0.45"
    stroke-width="1.5"
  />

</svg>