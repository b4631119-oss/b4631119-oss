name: Generate Games

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-games.yml]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          npm i -g pacman-contribution-graph
          mkdir -p dist
          for game in bomberman breakout puzzle-bobble galaga; do
            pacman-contribution-graph --platform github --username b4631119-oss --game $game --gameTheme github --output dist/$game-contribution-graph.svg || echo "failed $game light"
            pacman-contribution-graph --platform github --username b4631119-oss --game $game --gameTheme github-dark --output dist/$game-contribution-graph-dark.svg || echo "failed $game dark"
          done
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
