name: Generate Games

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-games.yml]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: npm i -g pacman-contribution-graph
      - run: mkdir -p dist
      - run: |
          pacman-contribution-graph --platform github --username b4631119-oss --game bomberman --gameTheme github --output dist/bomberman-contribution-graph.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game bomberman --gameTheme github-dark --output dist/bomberman-contribution-graph-dark.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game breakout --gameTheme github --scenario full --output dist/breakout-contribution-graph.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game breakout --gameTheme github-dark --scenario full --output dist/breakout-contribution-graph-dark.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game "puzzle-bobble" --gameTheme github --output dist/puzzle-bobble-contribution-graph.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game "puzzle-bobble" --gameTheme github-dark --output dist/puzzle-bobble-contribution-graph-dark.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game galaga --gameTheme github --output dist/galaga-contribution-graph.svg
          pacman-contribution-graph --platform github --username b4631119-oss --game galaga --gameTheme github-dark --output dist/galaga-contribution-graph-dark.svg
          ls -lh dist/
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}