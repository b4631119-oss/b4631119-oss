name: Generate Games

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-games.yml]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/bomberman-contribution-graph.svg?game=bomberman
            dist/bomberman-contribution-graph-dark.svg?game=bomberman&palette=github-dark
            dist/breakout-contribution-graph.svg?game=breakout
            dist/breakout-contribution-graph-dark.svg?game=breakout&palette=github-dark
            dist/puzzle-bobble-contribution-graph.svg?game=puzzle-bobble
            dist/puzzle-bobble-contribution-graph-dark.svg?game=puzzle-bobble&palette=github-dark
            dist/galaga-contribution-graph.svg?game=galaga
            dist/galaga-contribution-graph-dark.svg?game=galaga&palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
