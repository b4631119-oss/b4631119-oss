name: Generate Trophy

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-trophy.yml]

jobs:
  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g github-profile-trophy
          mkdir -p dist
          github-profile-trophy --username=b4631119-oss --theme=dracula --column=-1 --row=1 --margin-w=8 --margin-h=8 --no-bg --no-frame -o dist/trophy.svg || echo '<svg><text>trophy unavailable</text></svg>' > dist/trophy.svg
          cp dist/trophy.svg dist/github-contribution-trophy.svg
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}