name: Generate Trophy

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch trophy
        run: |
          mkdir -p dist
          curl -s "https://github-profile-trophy.vercel.app/?username=b4631119-oss&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false" -o dist/trophy.svg
          # также сохраняем под альтернативным именем из твоего ТЗ
          cp dist/trophy.svg dist/github-contribution-trophy.svg
      - name: push to trophy-output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
