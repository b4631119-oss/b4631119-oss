name: Generate Trophy

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-trophy.yml]

jobs:
  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          curl --retry 5 --retry-delay 5 --retry-all-errors -fsSL "https://github-profile-trophy.vercel.app/?username=b4631119-oss&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false" -o dist/trophy.svg || echo '<svg><text>trophy unavailable</text></svg>' > dist/trophy.svg
          cp dist/trophy.svg dist/github-contribution-trophy.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
