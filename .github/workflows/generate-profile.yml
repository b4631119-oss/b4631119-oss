name: Generate Profile (All)

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # push: disabled to avoid race
  #   branches: [main]
  # branches: [main]
  # paths: [README.md, .github/workflows/generate-profile.yml]

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g pacman-contribution-graph
          mkdir -p dist
          pacman-contribution-graph --platform github --username b4631119-oss --game pacman --gameTheme github --output dist/github-contribution-grid-pacman.svg || echo "failed pacman light"
          pacman-contribution-graph --platform github --username b4631119-oss --game pacman --gameTheme github-dark --output dist/github-contribution-grid-pacman-dark.svg || echo "failed pacman dark"
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  games:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g pacman-contribution-graph
          mkdir -p dist
          for game in bomberman breakout puzzle-bobble galaga; do
            pacman-contribution-graph --platform github --username b4631119-oss --game $game --gameTheme github --output dist/$game-contribution-graph.svg || echo "failed $game light"
            pacman-contribution-graph --platform github --username b4631119-oss --game $game --gameTheme github-dark --output dist/$game-contribution-graph-dark.svg || echo "failed $game dark"
          done
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats-langs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g github-readme-stats
          mkdir -p dist-stats dist-langs
          github-readme-stats --username=b4631119-oss --theme=dracula --hide_title --hide_rank --show_icons --include_all_commits --count_private --disable_animations --hide_border --locale=en -o dist-stats/stats.svg || echo '<svg><text>stats unavailable</text></svg>' > dist-stats/stats.svg
          github-readme-stats --username=b4631119-oss --theme=dracula --top_langs --layout=compact --card_width=320 --langs_count=5 --hide_border --locale=en -o dist-langs/languages.svg || echo '<svg><text>langs unavailable</text></svg>' > dist-langs/languages.svg
          ls -lh dist-stats/ dist-langs/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist-langs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g github-profile-trophy
          mkdir -p dist
          github-profile-trophy --username=b4631119-oss --theme=dracula --column=-1 --row=1 --margin-w=8 --margin-h=8 --no-bg --no-frame -o dist/trophy.svg || echo '<svg><text>trophy unavailable</text></svg>' > dist/trophy.svg
          cp dist/trophy.svg dist/github-contribution-trophy.svg
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g github-readme-activity-graph
          mkdir -p dist
          github-readme-activity-graph --username=b4631119-oss --theme=modern-lilac --radius=16 --area -o dist/activity-graph.svg || echo '<svg><text>activity unavailable</text></svg>' > dist/activity-graph.svg
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  three-d:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: b4631119-oss
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "chore: 3d contrib"
          git pull --rebase origin main || true
          git push