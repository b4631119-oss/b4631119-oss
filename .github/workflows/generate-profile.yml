name: Generate Profile (All)

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # push: disabled to avoid race
  #   branches: [main]
  # branches: [main]
  # paths: [README.md, .github/workflows/generate-profile.yml]

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g pacman-contribution-graph
          mkdir -p dist
          pacman-contribution-graph --platform github --username b4631119-oss --game pacman --gameTheme github --output dist/github-contribution-grid-pacman.svg || echo "failed pacman light"
          pacman-contribution-graph --platform github --username b4631119-oss --game pacman --gameTheme github-dark --output dist/github-contribution-grid-pacman-dark.svg || echo "failed pacman dark"
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  games:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g pacman-contribution-graph
          mkdir -p dist
          # bomberman works with real contributions
          pacman-contribution-graph --platform github --username b4631119-oss --game bomberman --gameTheme github --output dist/bomberman-contribution-graph.svg || echo "failed bomberman light"
          pacman-contribution-graph --platform github --username b4631119-oss --game bomberman --gameTheme github-dark --output dist/bomberman-contribution-graph-dark.svg || echo "failed bomberman dark"
          # breakout needs --scenario full for animation
          pacman-contribution-graph --platform github --username b4631119-oss --game breakout --gameTheme github --scenario full --output dist/breakout-contribution-graph.svg || echo "failed breakout light"
          pacman-contribution-graph --platform github --username b4631119-oss --game breakout --gameTheme github-dark --scenario full --output dist/breakout-contribution-graph-dark.svg || echo "failed breakout dark"
          # puzzle-bobble and galaga: static grids (no full game logic in tool)
          pacman-contribution-graph --platform github --username b4631119-oss --game "puzzle-bobble" --gameTheme github --output dist/puzzle-bobble-contribution-graph.svg || echo "failed puzzle-bobble light"
          pacman-contribution-graph --platform github --username b4631119-oss --game "puzzle-bobble" --gameTheme github-dark --output dist/puzzle-bobble-contribution-graph-dark.svg || echo "failed puzzle-bobble dark"
          pacman-contribution-graph --platform github --username b4631119-oss --game galaga --gameTheme github --output dist/galaga-contribution-graph.svg || echo "failed galaga light"
          pacman-contribution-graph --platform github --username b4631119-oss --game galaga --gameTheme github-dark --output dist/galaga-contribution-graph-dark.svg || echo "failed galaga dark"
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats-langs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm i node-fetch@2
      - run: node .github/scripts/generate-stats.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist-langs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm i node-fetch@2
      - run: node .github/scripts/generate-trophy.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm i node-fetch@2
      - run: node .github/scripts/generate-activity.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  three-d:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: b4631119-oss
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "chore: 3d contrib"
          git pull --rebase origin main || true
          git push