name: Generate Profile (All)

# Единый workflow именно под этот README.md — генерит все 7 веток за один прогон.
# Если отдельные workflow упадут из-за scope, этот их дублирует.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/generate-profile.yml"

jobs:
  pacman:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/github-contribution-grid-pacman.svg
            dist/github-contribution-grid-pacman-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  games:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/bomberman-contribution-graph.svg?game=bomberman
            dist/bomberman-contribution-graph-dark.svg?game=bomberman&palette=github-dark
            dist/breakout-contribution-graph.svg?game=breakout
            dist/breakout-contribution-graph-dark.svg?game=breakout&palette=github-dark
            dist/puzzle-bobble-contribution-graph.svg?game=puzzle-bobble
            dist/puzzle-bobble-contribution-graph-dark.svg?game=puzzle-bobble&palette=github-dark
            dist/galaga-contribution-graph.svg?game=galaga
            dist/galaga-contribution-graph-dark.svg?game=galaga&palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: b4631119-oss
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats-langs:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist-stats dist-langs
          curl -fsSL "https://github-readme-stats.vercel.app/api?username=b4631119-oss&hide_title=true&hide_rank=true&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false" -o dist-stats/stats.svg
          curl -fsSL "https://github-readme-stats.vercel.app/api/top-langs/?username=b4631119-oss&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false" -o dist-langs/languages.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: stats-output
          build_dir: dist-stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: languages-output
          build_dir: dist-langs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trophy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          curl -fsSL "https://github-profile-trophy.vercel.app/?username=b4631119-oss&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false" -o dist/trophy.svg
          cp dist/trophy.svg dist/github-contribution-trophy.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: trophy-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  activity:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=b4631119-oss&radius=16&theme=modern-lilac&area=true" -o dist/activity-graph.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  three-d:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: b4631119-oss
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git diff --cached --quiet || git commit -m "chore: 3d contrib"
          git push
