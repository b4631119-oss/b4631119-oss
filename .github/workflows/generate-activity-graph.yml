name: Generate Activity Graph

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-activity-graph.yml]

jobs:
  graph:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p dist
          curl -fsSL "https://github-readme-activity-graph.vercel.app/graph?username=b4631119-oss&radius=16&theme=modern-lilac&area=true" -o dist/activity-graph.svg
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
