name: Generate Activity Graph

concurrency:
  group: gh-pages-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [README.md, .github/workflows/generate-activity-graph.yml]

jobs:
  graph:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i -g github-readme-activity-graph
          mkdir -p dist
          github-readme-activity-graph --username=b4631119-oss --theme=modern-lilac --radius=16 --area -o dist/activity-graph.svg || echo '<svg><text>activity unavailable</text></svg>' > dist/activity-graph.svg
          ls -lh dist/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}